<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports — Hyna Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app-wrapper">
        <div id="sidebar-container"></div>
        <div class="main-wrapper">
            <div id="navbar-container"></div>

            <main class="content-body">
                <!-- REPORT FILTER TOOLBAR -->
                <div class="card mb-4" style="margin-bottom: 1.5rem;">
                    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem;">
                        <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
                            <div class="form-group mb-0" style="margin-bottom: 0;">
                                <label class="form-label text-xs">Report Type</label>
                                <select id="report-type-select" class="form-control" onchange="generateDepartmentReport()">
                                    <option value="Student Activity Report">Student Activity Report</option>
                                    <option value="Project Portfolio Report">Project Portfolio Report</option>
                                    <option value="Certificate Ledger Report">Certificate Ledger Report</option>
                                    <option value="Internship Summary Report">Internship Summary Report</option>
                                    <option value="Achievement Report">Achievement Report</option>
                                </select>
                            </div>

                            <div class="form-group mb-0" style="margin-bottom: 0;">
                                <label class="form-label text-xs">Department Year</label>
                                <select class="form-control" onchange="generateDepartmentReport()">
                                    <option value="ALL">All Academic Years</option>
                                    <option value="III">Year III</option>
                                    <option value="IV">Year IV</option>
                                </select>
                            </div>
                        </div>

                        <div style="display: flex; align-items: flex-end; gap: 0.75rem;">
                            <button class="btn btn-primary" onclick="generateDepartmentReport()">
                                <i class="fa-solid fa-rotate me-1"></i> Generate
                            </button>
                            <button class="btn btn-success" onclick="exportReportToCSV()">
                                <i class="fa-solid fa-file-csv me-1"></i> Export CSV
                            </button>
                            <button class="btn btn-secondary" onclick="showToast('Excel report download triggered.', 'info')">
                                <i class="fa-solid fa-file-excel me-1"></i> Excel
                            </button>
                            <button class="btn btn-secondary" onclick="window.print()">
                                <i class="fa-solid fa-print me-1"></i> Print
                            </button>
                        </div>
                    </div>
                </div>

                <!-- REPORT PREVIEW CARD -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title"><i class="fa-solid fa-file-lines text-primary"></i> Generated Report Preview</h3>
                        <span class="status-badge status-verified">Live Metric Data</span>
                    </div>
                    <div id="report-preview-container">
                        <!-- Rendered dynamically by reports.js -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/audit.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/app.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
