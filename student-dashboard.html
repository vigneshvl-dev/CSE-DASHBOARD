<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Hyna Studio</title>
    <!-- Font Awesome Icons & Chart.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app-wrapper">
        <!-- Sidebar Container (Rendered dynamically) -->
        <div id="sidebar-container"></div>

        <!-- Main Wrapper -->
        <div class="main-wrapper">
            <!-- Navbar Container (Rendered dynamically) -->
            <div id="navbar-container"></div>

            <!-- Dashboard Main Content Body -->
            <main class="content-body" id="dashboard-content-area">
                <!-- Dynamically populated by dashboard.js based on selected role -->
            </main>
        </div>
    </div>

    <!-- JS Core Libraries -->
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/audit.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
