<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificates — Hyna Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app-wrapper">
        <div id="sidebar-container"></div>
        <div class="main-wrapper">
            <div id="navbar-container"></div>

            <main class="content-body">
                <!-- TOOLBAR -->
                <div class="card mb-4" style="margin-bottom: 1.5rem;">
                    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem;">
                        <div class="global-search-bar" style="width: 320px;">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="cert-search-input" placeholder="Search certificates by title, issuer..." onkeyup="renderCertificatesTable()">
                        </div>

                        <button class="btn btn-primary" onclick="openModal('add-cert-modal')">
                            <i class="fa-solid fa-plus"></i> Add Certificate
                        </button>
                    </div>
                </div>

                <!-- CERTIFICATES TABLE CARD -->
                <div class="card">
                    <div class="table-responsive">
                        <table class="custom-table">
                            <thead>
                                <tr>
                                    <th>Certificate Title</th>
                                    <th>Issuing Organization</th>
                                    <th>Issue Date</th>
                                    <th>Credential ID</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="certificates-table-body">
                                <!-- Rendered dynamically by certificates.js -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- ADD CERTIFICATE MODAL -->
    <div class="modal-backdrop" id="add-cert-modal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 class="modal-title">Add New Certificate</h3>
                <button class="modal-close-btn" onclick="closeModal('add-cert-modal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="add-cert-form" onsubmit="submitNewCertificate(event)">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">Certificate Title *</label>
                        <input type="text" id="cert-title" class="form-control" placeholder="e.g. AWS Certified Solutions Architect" required>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label">Issuing Organization *</label>
                            <input type="text" id="cert-issuer" class="form-control" placeholder="e.g. Amazon Web Services" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Issue Date *</label>
                            <input type="date" id="cert-date" class="form-control" required>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label">Credential ID</label>
                            <input type="text" id="cert-cred-id" class="form-control" placeholder="AWS-ASA-994821">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Credential URL</label>
                            <input type="url" id="cert-cred-url" class="form-control" placeholder="https://aws.amazon.com/verify/...">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Description / Learnings</label>
                        <textarea id="cert-desc" class="form-control" rows="3" placeholder="Key domains covered..."></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('add-cert-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Certificate</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/audit.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/app.js"></script>
    <script src="js/certificates.js"></script>
</body>
</html>
