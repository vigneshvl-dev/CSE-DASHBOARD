<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achievements — Hyna Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app-wrapper">
        <div id="sidebar-container"></div>
        <div class="main-wrapper">
            <div id="navbar-container"></div>

            <main class="content-body">
                <!-- TOOLBAR BAR -->
                <div class="card mb-4" style="margin-bottom: 1.5rem;">
                    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem;">
                        <div class="global-search-bar" style="width: 280px;">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="ach-search-input" placeholder="Search achievements..." onkeyup="renderAchievementsGrid()">
                        </div>

                        <div style="display: flex; align-items: center; gap: 0.75rem;">
                            <select id="ach-filter-category" class="form-control" style="width: auto;" onchange="renderAchievementsGrid()">
                                <option value="ALL">All Categories</option>
                                <option value="Hackathon">Hackathons</option>
                                <option value="Publication">Publications</option>
                                <option value="Awards">Awards & Honors</option>
                                <option value="Competitions">Competitions</option>
                                <option value="Workshops">Workshops</option>
                            </select>

                            <button class="btn btn-primary" onclick="openModal('add-achievement-modal')">
                                <i class="fa-solid fa-plus"></i> Add Achievement
                            </button>
                        </div>
                    </div>
                </div>

                <!-- ACHIEVEMENTS GRID -->
                <div id="achievements-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem;">
                    <!-- Rendered dynamically by achievements.js -->
                </div>
            </main>
        </div>
    </div>

    <!-- ADD ACHIEVEMENT MODAL -->
    <div class="modal-backdrop" id="add-achievement-modal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 class="modal-title">Record New Achievement</h3>
                <button class="modal-close-btn" onclick="closeModal('add-achievement-modal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="add-achievement-form" onsubmit="submitNewAchievement(event)">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">Achievement Title *</label>
                        <input type="text" id="ach-title" class="form-control" placeholder="e.g. 1st Place Winner – National Hackathon" required>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label">Category *</label>
                            <select id="ach-category" class="form-control" required>
                                <option value="Hackathon">Hackathon</option>
                                <option value="Publication">Publication</option>
                                <option value="Awards">Awards & Honors</option>
                                <option value="Competitions">Competition</option>
                                <option value="Workshops">Workshop</option>
                                <option value="Courses">Course / Seminar</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Organization / Host *</label>
                            <input type="text" id="ach-org" class="form-control" placeholder="e.g. TechInnovate Summit" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Date Awarded *</label>
                        <input type="date" id="ach-date" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Description & Highlights</label>
                        <textarea id="ach-desc" class="form-control" rows="3" placeholder="Summary of achievement..."></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('add-achievement-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Achievement</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/audit.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/app.js"></script>
    <script src="js/achievements.js"></script>
</body>
</html>
