<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internships — Hyna Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app-wrapper">
        <div id="sidebar-container"></div>
        <div class="main-wrapper">
            <div id="navbar-container"></div>

            <main class="content-body">
                <!-- TOOLBAR -->
                <div class="card mb-4" style="margin-bottom: 1.5rem;">
                    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem;">
                        <div class="global-search-bar" style="width: 320px;">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="internship-search-input" placeholder="Search by company or role..." onkeyup="renderInternshipsList()">
                        </div>

                        <button class="btn btn-primary" onclick="openModal('add-internship-modal')">
                            <i class="fa-solid fa-plus"></i> Add Internship
                        </button>
                    </div>
                </div>

                <!-- INTERNSHIPS GRID -->
                <div id="internships-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem;">
                    <!-- Rendered dynamically by internships.js -->
                </div>
            </main>
        </div>
    </div>

    <!-- ADD INTERNSHIP MODAL -->
    <div class="modal-backdrop" id="add-internship-modal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 class="modal-title">Log Internship Experience</h3>
                <button class="modal-close-btn" onclick="closeModal('add-internship-modal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="add-internship-form" onsubmit="submitNewInternship(event)">
                <div class="modal-body">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label">Company / Organization *</label>
                            <input type="text" id="int-company" class="form-control" placeholder="e.g. Starlight Cybernetics" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Internship Role *</label>
                            <input type="text" id="int-role" class="form-control" placeholder="e.g. Software Engineering Intern" required>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label">Start Date *</label>
                            <input type="date" id="int-start" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">End Date</label>
                            <input type="date" id="int-end" class="form-control">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Duration</label>
                            <input type="text" id="int-duration" class="form-control" placeholder="e.g. 3 Months">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Key Skills Utilized (Comma Separated)</label>
                        <input type="text" id="int-skills" class="form-control" placeholder="JavaScript, REST APIs, Git">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Role Description & Key Achievements</label>
                        <textarea id="int-desc" class="form-control" rows="3" placeholder="Summary of responsibilities..."></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Offer Letter / Certificate Upload Simulator</label>
                        <div class="file-dropzone-sim" onclick="document.getElementById('int-file-input').click()">
                            <i class="fa-solid fa-cloud-arrow-up text-primary" style="font-size: 1.8rem; margin-bottom: 0.4rem;"></i>
                            <div class="font-semibold text-main text-sm">Click to upload offer letter or completion cert</div>
                            <input type="file" id="int-file-input" style="display: none;">
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('add-internship-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Internship</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/audit.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/app.js"></script>
    <script src="js/internships.js"></script>
</body>
</html>
