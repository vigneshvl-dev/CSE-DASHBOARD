<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs — Hyna Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app-wrapper">
        <div id="sidebar-container"></div>
        <div class="main-wrapper">
            <div id="navbar-container"></div>

            <main class="content-body">
                <!-- TOOLBAR -->
                <div class="card mb-4" style="margin-bottom: 1.5rem;">
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                        <div class="global-search-bar" style="width: 320px;">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="audit-search" placeholder="Filter audit logs..." onkeyup="renderAuditLogsTable()">
                        </div>

                        <span class="status-badge status-verified"><i class="fa-solid fa-shield-halved me-1"></i> System Trail Immutable</span>
                    </div>
                </div>

                <!-- AUDIT LOGS TABLE -->
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title"><i class="fa-solid fa-clipboard-list text-primary"></i> System Activity & Audit Trail</h3>
                    </div>
                    <div class="table-responsive">
                        <table class="custom-table">
                            <thead>
                                <tr>
                                    <th>User</th>
                                    <th>Action</th>
                                    <th>Target / Details</th>
                                    <th>Date</th>
                                    <th>Time</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="audit-table-body">
                                <!-- Rendered dynamically by audit.js -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/audit.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            renderAuditLogsTable();
        });
    </script>
</body>
</html>
