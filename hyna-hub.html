<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyna Hub — Community</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app-wrapper">
        <div id="sidebar-container"></div>
        <div class="main-wrapper">
            <div id="navbar-container"></div>

            <main class="content-body">
                <!-- TOOLBAR -->
                <div class="card mb-4" style="margin-bottom: 1.5rem;">
                    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem;">
                        <div class="global-search-bar" style="width: 280px;">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input type="text" id="hub-search-input" placeholder="Search feed posts..." onkeyup="renderHynaHubFeed()">
                        </div>

                        <div style="display: flex; align-items: center; gap: 0.75rem;">
                            <select id="hub-filter-category" class="form-control" style="width: auto;" onchange="renderHynaHubFeed()">
                                <option value="ALL">All Categ
￼
All Categories
￼
Create Post
ories</option>
                                <option value="Project Update">Project Updates</option>
                                <option value="Workshops">Workshops</option>
                                <option value="Hackathons">Hackathons</option>
                                <option value="Events">Events</option>
                            </select>

                            <button class="btn btn-primary" onclick="openModal('create-post-modal')">
                                <i class="fa-solid fa-pen-to-square"></i> Create Post
                            </button>
                        </div>
                    </div>
                </div>

                <!-- MAIN FEED CONTAINER (MAX-WIDTH FOR COMMUNITY FEEL) -->
                <div style="max-width: 800px; margin: 0 auto;">
                    <div id="hyna-hub-feed">
                        <!-- Rendered dynamically by hyna-hub.js -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- CREATE POST MODAL -->
    <div class="modal-backdrop" id="create-post-modal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 class="modal-title">Create Hyna Hub Post</h3>
                <button class="modal-close-btn" onclick="closeModal('create-post-modal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="create-post-form" onsubmit="submitNewHubPost(event)">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="form-label">Post Title *</label>
                        <input type="text" id="post-title" class="form-control" placeholder="e.g. Completed Autonomous Drone Prototype!" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Category *</label>
                        <select id="post-category" class="form-control" required>
                            <option value="Project Update">Project Update</option>
                            <option value="Workshops">Workshops</option>
                            <option value="Hackathons">Hackathons</option>
                            <option value="Events">Events</option>
                            <option value="Team Showcase">Team Showcase</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Post Description & Details *</label>
                        <textarea id="post-desc" class="form-control" rows="4" placeholder="Share your update, links, or event details..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Tags / Technologies (Comma Separated)</label>
                        <input type="text" id="post-skills" class="form-control" placeholder="Python, ROS, OpenCV">
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('create-post-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Publish Post</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/audit.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/app.js"></script>
    <script src="js/hyna-hub.js"></script>
</body>
</html>
